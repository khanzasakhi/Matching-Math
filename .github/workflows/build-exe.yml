
name: Build Matching Math EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --onefile --windowed --name "Matching Math" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Matching-Math-Windows
          path: dist/Matching Math.exe
